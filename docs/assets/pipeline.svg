<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="600" y="42" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">Per-turn decision pipeline</text>
  <text x="600" y="64" font-size="13" text-anchor="middle" fill="#64748b">Every intermediate result is surfaced in the UI</text>

  <!-- Cards -->
  <g>
    <rect x="28"  y="88" width="206" height="222" rx="12" fill="#f8faff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="256" y="88" width="206" height="222" rx="12" fill="#f8faff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="484" y="88" width="206" height="222" rx="12" fill="#f8faff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="712" y="88" width="206" height="222" rx="12" fill="#f8faff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="940" y="88" width="232" height="222" rx="12" fill="#f8faff" stroke="#c7d2fe" stroke-width="1.5"/>
  </g>

  <!-- Arrows -->
  <g stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)">
    <line x1="236" y1="199" x2="254" y2="199"/>
    <line x1="464" y1="199" x2="482" y2="199"/>
    <line x1="692" y1="199" x2="710" y2="199"/>
    <line x1="920" y1="199" x2="938" y2="199"/>
  </g>

  <!-- Badges -->
  <g fill="#4f46e5">
    <circle cx="52"  cy="112" r="14"/>
    <circle cx="280" cy="112" r="14"/>
    <circle cx="508" cy="112" r="14"/>
    <circle cx="736" cy="112" r="14"/>
    <circle cx="964" cy="112" r="14"/>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="52"  y="117">1</text>
    <text x="280" y="117">2</text>
    <text x="508" y="117">3</text>
    <text x="736" y="117">4</text>
    <text x="964" y="117">5</text>
  </g>

  <!-- Titles -->
  <g font-size="15" font-weight="700" fill="#1e1b4b">
    <text x="74"  y="117">Task recognition</text>
    <text x="302" y="117">State sensing</text>
    <text x="530" y="117">Rule matching</text>
    <text x="758" y="117">Risk check</text>
    <text x="986" y="117">Prompt assembly</text>
  </g>

  <!-- Body text -->
  <g font-size="12.5" fill="#334155">
    <text x="44" y="152">deepseek-chat classifies</text>
    <text x="44" y="174">the turn as:</text>
    <text x="44" y="200" font-weight="600">· factual</text>
    <text x="44" y="220" font-weight="600">· explanatory</text>
    <text x="44" y="240" font-weight="600">· exploratory</text>

    <text x="272" y="152">A1  syntax depth (LTP)</text>
    <text x="272" y="174">A2  sentiment (Baidu NLP)</text>
    <text x="272" y="196">A3  novelty (Baidu SimNet)</text>
    <text x="272" y="218">C1  turn number</text>
    <text x="272" y="240">C2  prior knowledge</text>

    <text x="500" y="152">R_full+  full high-gain</text>
    <text x="500" y="172">configurations</text>
    <text x="500" y="196" fill="#6366f1">↓ no match</text>
    <text x="500" y="218">R_core+  core conditions</text>
    <text x="500" y="238" fill="#6366f1">↓ no match</text>
    <text x="500" y="258">S_default  per-task default</text>

    <text x="728" y="152">Does S match a low-gain</text>
    <text x="728" y="172">rule in R⁻ for this state?</text>
    <text x="728" y="192" fill="#64748b" font-size="11.5">(R_core+ / default results)</text>
    <text x="728" y="216" font-weight="600">If yes:</text>
    <text x="728" y="236">search all 27 strategies</text>
    <text x="728" y="256">in {0, ½, 1}³, keep the</text>
    <text x="728" y="276">safe one nearest in</text>
    <text x="728" y="296">Hamming distance</text>

    <text x="956" y="152">One instruction per</text>
    <text x="956" y="172">dimension from a 3 × 3</text>
    <text x="956" y="192">instruction library</text>
    <text x="956" y="218">→ dynamic system prompt</text>
    <text x="956" y="240">→ deepseek-reasoner,</text>
    <text x="956" y="260">   streamed with its</text>
    <text x="956" y="280">   reasoning trace</text>
  </g>

  <!-- Outputs -->
  <g font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">
    <text x="131" y="290">task ∈ {1, 2, 3}</text>
    <text x="359" y="290">Ũ ∈ [0, 1]⁵</text>
    <text x="587" y="290">S_initial</text>
  </g>

  <!-- Footer: input / output -->
  <g font-size="13" fill="#475569">
    <text x="28" y="346">▶ <tspan font-weight="700" fill="#0f172a">Input</tspan>  user message + last turns</text>
    <text x="1172" y="346" text-anchor="end"><tspan font-weight="700" fill="#0f172a">Output</tspan>  S★ = (syntax, concept, proactivity) → streamed reply ▶</text>
  </g>
</svg>
