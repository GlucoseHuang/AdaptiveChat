<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1200" height="420" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Panel A -->
  <text x="40" y="46" font-size="18" font-weight="700" fill="#0f172a">A · Knowledge gain</text>
  <text x="40" y="68" font-size="12.5" fill="#64748b">Knowledge-gain score, 15 participants per group</text>

  <line x1="60" y1="350" x2="540" y2="350" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- gridlines at 20, 40, 60 (4 px per point) -->
  <g stroke="#e2e8f0" stroke-dasharray="3 4">
    <line x1="60" y1="270" x2="540" y2="270"/>
    <line x1="60" y1="190" x2="540" y2="190"/>
    <line x1="60" y1="110" x2="540" y2="110"/>
  </g>
  <g font-size="11.5" fill="#94a3b8" text-anchor="end">
    <text x="52" y="354">0</text>
    <text x="52" y="274">20</text>
    <text x="52" y="194">40</text>
    <text x="52" y="114">60</text>
  </g>

  <rect x="120" y="204.24" width="140" height="145.76" rx="6" fill="#94a3b8"/>
  <rect x="340" y="118.52" width="140" height="231.48" rx="6" fill="#4f46e5"/>
  <g font-size="20" font-weight="700" text-anchor="middle">
    <text x="190" y="194" fill="#475569">36.44</text>
    <text x="410" y="108" fill="#4f46e5">57.87</text>
  </g>
  <g font-size="13.5" font-weight="600" text-anchor="middle" fill="#334155">
    <text x="190" y="374">Control</text>
    <text x="410" y="374">Adaptive</text>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#94a3b8">
    <text x="190" y="392">fixed mid-level strategy</text>
    <text x="410" y="392">state-aware strategy</text>
  </g>

  <!-- Gain badge -->
  <rect x="380" y="28" width="150" height="30" rx="15" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="455" y="48" font-size="13.5" font-weight="700" text-anchor="middle" fill="#4338ca">+58.8%  ·  p &lt; .001</text>

  <line x1="600" y1="40" x2="600" y2="390" stroke="#e2e8f0"/>

  <!-- Panel B -->
  <text x="640" y="46" font-size="18" font-weight="700" fill="#0f172a">B · Empirical rule coverage</text>
  <text x="640" y="68" font-size="12.5" fill="#64748b">Share of 66 interactions by matched rule set</text>

  <rect x="640" y="110" width="500" height="44" rx="10" fill="#e2e8f0"/>
  <clipPath id="bar"><rect x="640" y="110" width="500" height="44" rx="10"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="640"    y="110" width="91"    height="44" fill="#4f46e5"/>
    <rect x="731"    y="110" width="242.5" height="44" fill="#818cf8"/>
    <rect x="973.5"  y="110" width="166.5" height="44" fill="#cbd5e1"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="685.5" y="137">18.2%</text>
    <text x="852"   y="137">48.5%</text>
  </g>
  <text x="1056" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#475569">33.3%</text>

  <g font-size="12.5" fill="#334155">
    <rect x="640" y="178" width="12" height="12" rx="3" fill="#4f46e5"/>
    <text x="660" y="189"><tspan font-weight="700">R_full+</tspan>  full high-gain configuration</text>
    <rect x="640" y="204" width="12" height="12" rx="3" fill="#818cf8"/>
    <text x="660" y="215"><tspan font-weight="700">R_core+</tspan>  core-condition generalisation</text>
    <rect x="640" y="230" width="12" height="12" rx="3" fill="#cbd5e1"/>
    <text x="660" y="241"><tspan font-weight="700">No rule matched</tspan>  per-task default</text>
  </g>
  <text x="640" y="278" font-size="13" fill="#0f172a"><tspan font-weight="700">66.7%</tspan> of turns were backed by an empirical configuration.</text>

  <!-- Cost parity -->
  <rect x="640" y="302" width="500" height="84" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="658" y="326" font-size="12.5" font-weight="700" fill="#0f172a">No significant cost difference (control vs. adaptive)</text>
  <g font-size="12.5" fill="#334155">
    <text x="658" y="352">Response time</text>
    <text x="800" y="352" font-weight="600">52.41 s  vs.  52.17 s</text>
    <text x="1060" y="352" fill="#64748b">n.s.</text>
    <text x="658" y="374">Token usage</text>
    <text x="800" y="374" font-weight="600">1,433  vs.  1,487</text>
    <text x="1060" y="374" fill="#64748b">n.s.</text>
  </g>
</svg>
