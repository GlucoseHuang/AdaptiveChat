<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6b8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6b8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>

  <!-- Title block -->
  <text x="72" y="118" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Adaptive Chat</text>
  <rect x="74" y="136" width="84" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="186" font-size="25" fill="#c7d2fe">Read the user's state. Choose the strategy.</text>
  <text x="72" y="220" font-size="25" fill="#c7d2fe">Show the decision.</text>

  <g font-size="14" font-weight="600" fill="#e0e7ff">
    <rect x="72" y="258" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="156" y="280" text-anchor="middle">fsQCA-derived rules</text>
    <rect x="252" y="258" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="336" y="280" text-anchor="middle">Explainable by design</text>
    <rect x="432" y="258" width="212" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="538" y="280" text-anchor="middle">+58.8% knowledge gain (n=30)</text>
  </g>

  <!-- Motif: 5 state dimensions -> decision function -> 3 strategy dimensions -->
  <g stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M848 80 C 900 80, 910 170, 962 170"/>
    <path d="M848 125 C 900 125, 910 170, 962 170"/>
    <path d="M848 170 L 962 170"/>
    <path d="M848 215 C 900 215, 910 170, 962 170"/>
    <path d="M848 260 C 900 260, 910 170, 962 170"/>
    <path d="M1038 170 C 1070 170, 1070 105, 1098 105"/>
    <path d="M1038 170 L 1098 170"/>
    <path d="M1038 170 C 1070 170, 1070 235, 1098 235"/>
  </g>

  <g font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="830" cy="80"  r="18" fill="#6b8cff" fill-opacity="0.95"/><text x="830" y="85">A1</text>
    <circle cx="830" cy="125" r="18" fill="#6b8cff" fill-opacity="0.55"/><text x="830" y="130">A2</text>
    <circle cx="830" cy="170" r="18" fill="#6b8cff" fill-opacity="0.8"/><text x="830" y="175">A3</text>
    <circle cx="830" cy="215" r="18" fill="#6b8cff" fill-opacity="0.35"/><text x="830" y="220">C1</text>
    <circle cx="830" cy="260" r="18" fill="#6b8cff" fill-opacity="1"/><text x="830" y="265">C2</text>
  </g>

  <rect x="962" y="132" width="76" height="76" rx="16" fill="#1e1b4b" stroke="url(#accent)" stroke-width="2.5"/>
  <text x="1000" y="179" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff" font-style="italic">f(Ũ)</text>

  <g font-size="12" fill="#a5b4fc">
    <text x="1098" y="91">syntax</text>
    <rect x="1098" y="98" width="110" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="1098" y="98" width="110" height="14" rx="7" fill="url(#accent)"/>
    <text x="1098" y="156">concept</text>
    <rect x="1098" y="163" width="110" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="1098" y="163" width="55" height="14" rx="7" fill="url(#accent)"/>
    <text x="1098" y="221">proactivity</text>
    <rect x="1098" y="228" width="110" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="1098" y="228" width="0" height="14" rx="7" fill="url(#accent)"/>
  </g>
  <text x="1018" y="308" font-size="12" text-anchor="middle" fill="#818cf8">state  Ũ ∈ [0,1]⁵   →   strategy  S ∈ {0, ½, 1}³</text>
</svg>
